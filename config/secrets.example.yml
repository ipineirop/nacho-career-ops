# config/secrets.yml — Credentials for authenticated scanners
# NEVER commit config/secrets.yml to git (it's gitignored).
# Copy this file to config/secrets.yml and fill in your credentials.

# Apify — LinkedIn Jobs Scraper (no LinkedIn credentials needed)
# Get your token at: https://console.apify.com/account/integrations
# Used by: node scan-linkedin-apify.mjs
apify:
  api_token: "apify_api_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# LinkedIn direct scraper (Playwright-based, alternative to Apify)
# Used by: node scan-linkedin.mjs
linkedin:
  email: "your@email.com"
  password: "yourpassword"
