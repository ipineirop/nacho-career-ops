  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-display: swap;\n  src: url(\"ffd88c2b-e527-4405-9b28-5f33351f656f\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f37f4b6a-2dec-4efa-aa8f-5386eed989f5\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* symbols2 */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c28c7e26-24eb-4006-bd10-34e8cfcb091b\") format('woff2');\n  unicode-range: U+2000-2001, U+2004-2008, U+200A, U+23B8-23BD, U+2500-259F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"59729d28-4812-4fec-9784-60c420e7df26\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"0c49a930-d8c5-48a3-b92f-3ffd2ecb3efc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e42eb7f8-6bb2-4006-b741-1a1a731118e6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* ============================================================ */\n  /* TOKENS — Labra Design System v1.0                              */\n  /* ============================================================ */\n  :root, .theme-light {\n    --bg:        #f6f8f8;\n    --surface:   #ffffff;\n    --surface-2: #fafcfc;\n    --canvas:    #f0f4f4;\n    --ink:       #0a1f24;\n    --ink-2:     #455258;\n    --ink-3:     #889399;\n    --line:      #e2e7e8;\n    --line-2:    #eef2f2;\n    --track:     #edf1f1;\n    --accent:    #0d7c89;\n    --accent-h:  #0a6973;\n    --accent-soft: #d6eef0;\n    --accent-on: #ffffff;\n    --signal:      #c97b0e;\n    --signal-soft: #fbecd6;\n    --signal-bg:   #FAEEDA;\n    --signal-ink:  #854F0B;\n    --signal-deep: #4A2A0C;\n    --signal-on:   #ffffff;\n  }\n  .theme-dark {\n    --bg:        #0a0e14;\n    --surface:   #1a2230;\n    --surface-2: #161d27;\n    --canvas:    #0f1620;\n    --ink:       #f4f6fa;\n    --ink-2:     #c4cad6;\n    --ink-3:     #8893a3;\n    --line:      #2a3543;\n    --line-2:    #1d2630;\n    --track:     #2a3543;\n    --accent:    #5cb1ff;\n    --accent-h:  #7ec0ff;\n    --accent-soft: #1a2d44;\n    --accent-on: #06101c;\n    --signal:      #ecae4d;\n    --signal-soft: #382b16;\n    --signal-bg:   #2a1f10;\n    --signal-ink:  #f2c987;\n    --signal-deep: #f8dfaf;\n    --signal-on:   #0a0e14;\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: \"Albert Sans\", system-ui, sans-serif;\n    background: var(--bg); color: var(--ink);\n    font-size: 14px; line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    transition: background .25s, color .25s;\n  }\n\n  /* i18n */\n  [data-lang=\"en\"] .es { display: none; }\n  [data-lang=\"es\"] .en { display: none; }\n\n  /* ============================================================ */\n  /* TOP CHROME (PAGE)                                              */\n  /* ============================================================ */\n  .top {\n    position: sticky; top: 0; z-index: 50;\n    background: var(--bg);\n    border-bottom: 1px solid var(--line);\n    padding: 14px 32px;\n    display: flex; align-items: center; gap: 18px;\n  }\n  .brand {\n    font-family: \"Fraunces\", serif; font-weight: 500;\n    font-size: 26px; line-height: 1; letter-spacing: -0.6px; color: var(--ink);\n  }\n  .brand .dot { color: var(--accent); font-style: italic; }\n  .brand .system {\n    margin-left: 10px; font-family: \"Geist Mono\", monospace;\n    font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .top .spacer { flex: 1; }\n  .top .toggles { display: flex; gap: 8px; align-items: center; }\n  .seg {\n    border: 1px solid var(--line); background: var(--surface);\n    padding: 4px; border-radius: 999px;\n    display: inline-flex; gap: 2px;\n  }\n  .seg button {\n    border: 0; background: transparent;\n    padding: 4px 12px; border-radius: 999px;\n    font-family: \"Albert Sans\"; font-size: 12px; font-weight: 500;\n    color: var(--ink-3); cursor: pointer;\n  }\n  .seg button.on { background: var(--ink); color: var(--bg); }\n  .version {\n    font-family: \"Geist Mono\", monospace; font-size: 11px;\n    color: var(--ink-3); letter-spacing: 0.4px; text-transform: uppercase;\n  }\n\n  /* ============================================================ */\n  /* PAGE LAYOUT                                                    */\n  /* ============================================================ */\n  .stage { max-width: 1560px; margin: 0 auto; padding: 36px 32px 80px; }\n  .hero { margin: 0 0 40px; max-width: 1000px; }\n  .hero .kicker {\n    font-family: \"Geist Mono\", monospace; font-size: 11px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n    margin-bottom: 14px;\n  }\n  .hero h1 {\n    font-family: \"Fraunces\", serif; font-weight: 400;\n    font-size: 60px; line-height: 1; margin: 0; letter-spacing: -1.6px; color: var(--ink);\n  }\n  .hero h1 em { font-style: italic; }\n  .hero p {\n    font-family: \"Albert Sans\"; font-size: 16.5px; line-height: 1.6;\n    color: var(--ink-2); margin: 14px 0 0; max-width: 840px; text-wrap: pretty;\n  }\n  .hero p b { color: var(--ink); font-weight: 600; }\n\n  .principles {\n    margin-top: 28px;\n    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\n  }\n  .principle {\n    border: 1px solid var(--line); background: var(--surface);\n    border-radius: 12px; padding: 16px 18px;\n    display: flex; flex-direction: column; gap: 6px;\n  }\n  .principle .pn {\n    font-family: \"Geist Mono\", monospace; font-size: 10px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .principle .pt {\n    font-family: \"Fraunces\", serif; font-weight: 500;\n    font-size: 18px; line-height: 1.2; letter-spacing: -0.3px; color: var(--ink);\n  }\n  .principle .pt em { font-style: italic; }\n  .principle .pd {\n    font-family: \"Albert Sans\"; font-size: 13px; line-height: 1.5; color: var(--ink-2);\n  }\n\n  /* ============================================================ */\n  /* SCREEN BLOCKS                                                  */\n  /* ============================================================ */\n  .screen { margin-bottom: 72px; scroll-margin-top: 80px; }\n  .screen-label {\n    display: flex; align-items: baseline; gap: 14px;\n    margin-bottom: 18px; padding: 0 4px;\n  }\n  .screen-label .num {\n    font-family: \"Geist Mono\", monospace; font-size: 10.5px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n    padding: 4px 10px; border-radius: 999px; background: var(--canvas);\n  }\n  .screen-label h2 {\n    font-family: \"Fraunces\", serif; font-weight: 400;\n    font-size: 30px; line-height: 1; margin: 0; letter-spacing: -0.8px; color: var(--ink);\n  }\n  .screen-label h2 em { font-style: italic; }\n  .screen-label .tag { font-family: \"Albert Sans\"; font-size: 13px; color: var(--ink-3); }\n\n  .frame {\n    background: var(--surface);\n    border: 1px solid var(--line);\n    border-radius: 14px; overflow: hidden;\n  }\n  .frame-bar {\n    height: 34px; background: var(--canvas);\n    border-bottom: 1px solid var(--line);\n    display: flex; align-items: center; gap: 8px; padding: 0 16px;\n  }\n  .frame-bar .fdot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }\n  .frame-bar .url {\n    margin-left: 12px; font-family: \"Geist Mono\", monospace; font-size: 11.5px;\n    color: var(--ink-3); letter-spacing: 0.3px;\n  }\n\n  /* ============================================================ */\n  /* DASHBOARD APP SHELL                                            */\n  /* ============================================================ */\n  .app {\n    background: var(--bg);\n    min-height: 880px;\n  }\n  .appbar {\n    border-bottom: 0.75px solid var(--line);\n    padding: 14px 36px;\n    display: flex; align-items: center; gap: 18px;\n    background: var(--bg);\n  }\n  .appbar .brand-small {\n    font-family: \"Fraunces\", serif; font-weight: 500;\n    font-size: 22px; line-height: 1; color: var(--ink);\n  }\n  .appbar .brand-small .dot { color: var(--accent); font-style: italic; }\n  .appbar .nav { display: flex; gap: 2px; margin-left: 18px; }\n  .appbar .nav a {\n    text-decoration: none; padding: 6px 13px; border-radius: 999px;\n    font-family: \"Albert Sans\"; font-weight: 500; font-size: 13px;\n    color: var(--ink-3);\n  }\n  .appbar .nav a.on { background: var(--ink); color: var(--bg); }\n  .appbar .nav a:hover:not(.on) { color: var(--ink); }\n  .appbar .spacer { flex: 1; }\n  .appbar .userline {\n    font-family: \"Geist Mono\", monospace; font-size: 11px; color: var(--ink-3);\n    display: flex; gap: 10px; align-items: center;\n  }\n  .appbar .userline .dot-sep { color: var(--ink-3); opacity: .5; }\n  .appbar .userline .name { color: var(--ink-2); }\n\n  /* ============================================================ */\n  /* DASHBOARD GRID                                                 */\n  /* ============================================================ */\n  .dash {\n    max-width: 1320px; margin: 0 auto;\n    padding: 40px 48px 64px;\n    display: grid;\n    grid-template-columns: minmax(0, 1fr) 380px;\n    gap: 56px;\n    align-items: start;\n  }\n\n  /* Editorial masthead inside the dashboard */\n  .masthead {\n    grid-column: 1 / -1;\n    display: flex; align-items: flex-end; justify-content: space-between;\n    gap: 36px; flex-wrap: wrap;\n    border-bottom: 0.75px solid var(--line);\n    padding-bottom: 22px; margin-bottom: 14px;\n  }\n  .masthead .left { display: flex; flex-direction: column; gap: 8px; }\n  .masthead .date {\n    font-family: \"Geist Mono\", monospace; font-size: 11px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .masthead h1 {\n    font-family: \"Fraunces\", serif; font-weight: 400;\n    font-size: 64px; line-height: 0.95; margin: 0;\n    letter-spacing: -1.8px; color: var(--ink);\n  }\n  .masthead h1 em { font-style: italic; }\n  .masthead .strap {\n    font-family: \"Albert Sans\"; font-size: 15px; color: var(--ink-2);\n    margin-top: 10px; max-width: 540px;\n  }\n  .masthead .strap b { color: var(--ink); font-weight: 600; }\n\n  /* Mode chip (compact, dignified) */\n  .mode-chip {\n    display: inline-flex; flex-direction: column; gap: 6px;\n    background: var(--surface); border: 0.75px solid var(--line);\n    border-radius: 12px; padding: 12px 16px;\n    min-width: 200px;\n  }\n  .mode-chip .lbl {\n    font-family: \"Geist Mono\", monospace; font-size: 10px;\n    letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .mode-chip .val {\n    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\n  }\n  .mode-chip .val .name {\n    font-family: \"Fraunces\", serif; font-weight: 500;\n    font-size: 22px; line-height: 1; letter-spacing: -0.4px; color: var(--ink);\n  }\n  .mode-chip .val .name em { font-   /* Evaluate panel — the persistent wedge */\n  .evaluate-panel {\n    background: var(--surface);\n    border: 0.75px solid var(--line);\n    border-radius: 14px; overflow: hidden;\n  }\n  .evaluate-panel .ev-top {\n    padding: 18px 20px 14px;\n    display: flex; flex-direction: column; gap: 10px;\n  }\n  .evaluate-panel .ev-kicker {\n    font-family: \"Geist Mono\", monospace; font-size: 10.5px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .evaluate-panel .ev-title {\n    font-family: \"Fraunces\", serif; font-weight: 400;\n    font-size: 24px; line-height: 1.1; letter-spacing: -0.5px; color: var(--ink);\n  }\n  .evaluate-panel .ev-title em { font-style: italic; }\n  .evaluate-panel .ev-sub {\n    font-family: \"Albert Sans\"; font-size: 13px; color: var(--ink-2); line-height: 1.5;\n  }\n  .evaluate-panel .ev-paste {\n    border-top: 0.75px solid var(--line);\n    background: var(--canvas);\n    padding: 14px 18px;\n    display: flex; flex-direction: column; gap: 10px;\n  }\n  .evaluate-panel .ev-paste .field {\n    background: var(--surface); border: 0.75px dashed var(--line);\n    border-radius: 10px; padding: 14px 14px;\n    min-height: 76px;\n    display: flex; flex-direction: column; gap: 6px;\n    cursor: text;\n  }\n  .evaluate-panel .ev-paste .field .hint {\n    font-family: \"Albert Sans\"; font-size: 13px; color: var(--ink-3); line-height: 1.5;\n  }\n  .evaluate-panel .ev-paste .field .or {\n    font-family: \"Geist Mono\", monospace; font-size: 10px;\n    letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3);\n  }\n  .evaluate-panel .ev-row {\n    display: flex; gap: 8px; align-items: center;\n  }\n  .evaluate-panel .btn-eval {\n    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n    padding: 11px 14px; border-radius: 999px;\n    background: var(--accent); color: var(--accent-on);\n    border: 0; font-family: \"Albert Sans\"; font-weight: 600; font-size: 14px;  their market. The action is paste a recruiter DM — persistent in the right rail, never shouting. No metric strip, no charts, no streaks.<\u002Fspan>\n        <span class=\"es\">La superficie post-login se lee como abrir The Economist un domingo: una cabecera con fecha, una lista breve de lo que merece la atención del usuario hoy, y un dato sobrio sobre su mercado. La acción es pegar un DM de reclutador — persistente en la columna derecha, nunca gritando. Sin tira de métricas, sin gráficas, sin rachas.<\u002Fspan>\n      <\u002Fp>\n      <div class=\"principles\">\n        <div class=\"principle\">\n          <span class=\"pn\">01<\u002Fspan>\n          <span class=\"pt\"><span class=\"en\">Three answers in <em>10 seconds<\u002Fem>.<\u002Fspan><span class=\"es\">Tres respuestas en <em>10 segundos<\u002Fem>.<\u002Fspan><\u002Fspan>\n          <span class=\"pd\"><span class=\"en\">Anything to do? What's in pipeline? What's the market saying? Each lives in one named section.<\u002Fspan><span class=\"es\">¿Algo que hacer? ¿Qué hay en pipeline? ¿Qué dice el mercado? Cada uno vive en una sección con nombre.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"principle\">\n          <span class=\"pn\">02<\u002Fspan>\n          <span class=\"pt\"><span class=\"en\">Reading column, <em>not<\u002Fem> a grid.<\u002Fspan><span class=\"es\">Columna de lectura, <em>no<\u002Fem> una cuadrícula.<\u002Fspan><\u002Fspan>\n          <span class=\"pd\"><span class=\"en\">Editorial serif headings, one-line lead entries. Numbers in Fraunces; metadata in Geist Mono. No cards-on-cards.<\u002Fspan><span class=\"es\">Encabezados en serif editorial, entradas de una línea. Números en Fraunces; metadata en Geist Mono. Sin tarjetas dentro de tarjetas.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"principle\">\n          <span class=\"pn\">03<\u002Fspan>\n          <span class=\"pt\"><span class=\"en\">Evaluate is <em>always<\u002Fem> one click.<\u002Fspan><spa  <\u002Fdiv>\n\n      <!-- Annotations -->\n      <div class=\"annot\">\n        <div class=\"a\">\n          <span class=\"nk\">A · Masthead<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Date, title, summary line — read as one<\u002Fspan><span class=\"es\">Fecha, título y resumen — se leen como uno<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">Mode chip sits beside the headline, not above the page. It's contextual to today, not chrome.<\u002Fspan>\n            <span class=\"es\">El chip de modo va junto al titular, no encima de la página. Es contexto del día, no chrome.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">B · Reading column<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Three sections, top to bottom<\u002Fspan><span class=\"es\">Tres secciones, de arriba a abajo<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">New leads → Follow-ups → Recent. Order = urgency. Each section is its own row, divided by a hairline, not boxed.<\u002Fspan>\n            <span class=\"es\">Vacantes nuevas → Seguimientos → Recientes. Orden = urgencia. Cada sección es su propia fila, dividida por una línea, no encajonada.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">C · Persistent Evaluate<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">The wedge moment lives in the rail<\u002Fspan><span class=\"es\">El momento clave vive en la columna<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">A real paste field, not a button to another page. ⌘V works anywhere. Visible on every state, including quiet days.<\u002Fspan>\n            <span class=\"es\">Un campo real para pegar, no un botón a otra página. ⌘V funciona en toda la página. Visible en cada estado.<\u002Fspan>\n          <\u002Fspan>\n        <\        <\u002Fdiv>\n\n      <\u002Fdiv><!-- /.mobile-row -->\n\n      <!-- Annotations sit below all three phones -->\n      <div class=\"annot\" style=\"margin-top: 32px;\">\n        <div class=\"a\">\n          <span class=\"nk\">M-A · Masthead compressed<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Same headline shape, smaller scale<\u002Fspan><span class=\"es\">Mismo titular, menor escala<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">38px Fraunces holds the editorial register. The mode chip becomes a one-row strip below.<\u002Fspan>\n            <span class=\"es\">Fraunces 38px sostiene el registro editorial. El chip de modo se convierte en una franja debajo.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-B · Empty paste card<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Bigger than a button, smaller than a screen<\u002Fspan><span class=\"es\">Más que un botón, menos que una pantalla<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">The new-user paste prompt holds the headline, the field, and the CTA in one card — no sticky bar competing below.<\u002Fspan>\n            <span class=\"es\">El prompt del usuario nuevo guarda titular, campo y CTA en una sola tarjeta — sin barra inferior compitiendo.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-C · Lead rows<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Logo · role · score<\u002Fspan><span class=\"es\">Logo · rol · puntaje<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">Tap-area = full row. Score is the right anchor — strong fits teal, weak fits grey. Score range stays honest at small size.<\u002Fspan>\n            <span class=\"es\">Área tap = fila completa. El puntaje ancla a la derecha — fuertes en teal, débiles en gris. El rango se mantiene honesto en pequeño.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-D · Follow-up as note<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Amber, conversational<\u002Fspan><span class=\"es\">Ámbar, conversacional<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">An italic sentence with 9 days highlighted. Two buttons fill the row: act or snooze.<\u002Fspan>\n            <span class=\"es\">Una frase en itálicas con 9 días resaltados. Dos botones llenan la fila: actuar o posponer.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-E · Pipeline 4-up<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Four small cards, one row<\u002Fspan><span class=\"es\">Cuatro tarjetas pequeñas, una fila<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">The only place we let pipeline use boxed cards — the screen is too narrow for a hairline list to read.<\u002Fspan>\n            <span class=\"es\">El único sitio donde permitimos tarjetas — la pantalla es demasiado angosta para una lista con línea fina.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-F · Quiet day reframe<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Same shell, different weight<\u002Fspan><span class=\"es\">Mismo shell, distinto peso<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">\"Nothing matched your filters\" replaces lead rows. Recent gets 4 rows instead of 3. Market is bumped from MXN figure to comparative (+15%).<\u002Fspan>\n            <span class=\"es\">\"Nada pasó tus filtros\" reemplaza las vacantes. Recientes muestra 4 filas. El mercado pasa de la cifra MXN a una comparativa (+15%).<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-G · Market preserved<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Soft mint, same n<\u002Fspan><span class=\"es\">Menta suave, misma n<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">The market card holds its meaning at small size — single figure, single source line, sample size visible.<\u002Fspan>\n            <span class=\"es\">La tarjeta de mercado mantiene su sentido a tamaño pequeño — una cifra, una línea de fuente, n visible.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-H · Sticky Evaluate<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Pill at the thumb<\u002Fspan><span class=\"es\">Píldora a la altura del pulgar<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">Persistent on loaded + quiet states. The hint copy adapts (\"Drop an old DM…\" on a quiet day). Tap-to-paste replaces ⌘V on mobile.<\u002Fspan>\n            <span class=\"es\">Persistente en estados cargado y tranquilo. El hint adapta su copy (\"Pega un DM antiguo…\" en día tranquilo). Tap-para-pegar reemplaza ⌘V.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"a\">\n          <span class=\"nk\">M-I · No bottom bar on empty<\u002Fspan>\n          <span class=\"ah\"><span class=\"en\">Don't compete with the main move<\u002Fspan><span class=\"es\">No competir con el movimiento principal<\u002Fspan><\u002Fspan>\n          <span class=\"ab\">\n            <span class=\"en\">On the empty state, the paste card <b>is<\u002Fb> the screen. A sticky pill below would just echo the same CTA twice. Skip it.<\u002Fspan>\n            <span class=\"es\">En el estado vacío, la tarjeta <b>es<\u002Fb> la pantalla. Una píldora inferior solo duplicaría el CTA. Se omite.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u0
