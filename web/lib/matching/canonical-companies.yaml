# Labra Canonical Company Table — v2 Expanded Set
#
# 694 entries covering high-likelihood appearances in Labra Evaluate runs.
# Generated as a starting point — team review required before deploy.
#
# Per-entry trust calibration:
#   - canonical_id, display_name: Claude-confident
#   - country_primary, industry_tags, stage: Claude-confident for well-known companies
#   - aliases: Claude-confident on common patterns, may miss country-specific variants
#   - related_entities, acquisition_lineage: VERIFY before deploy where present
#   - country_present_in: best-effort, may miss smaller markets
#
# Fields marked `notes: VERIFY` need human review before this table ships.
#
# Sparse entries: many fields are intentionally omitted where I'm not confident.
# An entry with only canonical_id, display_name, and a partial alias list is still
# useful — the matching pipeline will work, the verdict copy will work, and missing
# fields can be filled in later from real data.
#
# What this list deliberately does NOT do:
#   - Guess acquisition years (most lineage fields are empty unless I'm certain)
#   - Invent subsidiaries
#   - Pad with companies I can't verify exist
#
# Real-data growth via §4.3 of the spec (unmatched-strings backlog) will fill
# the remaining gaps over the first 4-6 weeks of operation.

